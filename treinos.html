<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treino TAE</title>
<style>
:root{
  --fundo:#111213;--cartao:#1b1d1f;--alto:#232629;--borda:#2c3034;
  --amarelo:#f7d046;--amarelo2:#d9b32c;--texto:#dee2e6;--forte:#fff;
  --fraco:#8d9499;--verde:#4ade80;--vermelho:#f87171;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.caixa{max-width:720px;margin:0 auto;padding:4px 2px 18px}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:22px}

.topo{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.etiqueta{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--amarelo);text-transform:uppercase}
.passo{margin-left:auto;font-size:12.5px;color:var(--fraco);white-space:nowrap}
.trilho{height:4px;background:var(--borda);border-radius:99px;overflow:hidden;margin-bottom:20px}
.trilho i{display:block;height:100%;background:var(--amarelo);border-radius:99px;transition:width .35s ease}

h2{margin:0 0 7px;font-size:18px;font-weight:700;line-height:1.45;color:var(--forte)}
.ajuda{margin:0 0 16px;font-size:13.5px;line-height:1.6;color:var(--fraco)}
.instrucao{
  margin:-8px 0 16px;font-size:12.5px;font-weight:600;
  color:var(--amarelo);letter-spacing:.01em;
}

.fala{
  background:var(--alto);border-left:3px solid var(--fraco);
  padding:14px 15px;border-radius:0 10px 10px 0;margin-bottom:16px;
  font-size:14px;line-height:1.65;font-style:italic;
}
.fala.limpa{border-left-color:var(--verde);font-style:normal}

.lista{display:flex;flex-direction:column;gap:8px}
.op{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--alto);border:1.5px solid var(--borda);border-radius:11px;
  padding:12px 14px;cursor:pointer;font-family:inherit;font-size:14.5px;
  line-height:1.5;color:var(--texto);transition:border-color .13s,background .13s,opacity .2s;
}
.op:hover:not(:disabled){border-color:var(--amarelo)}
.op:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.op:disabled{cursor:default}
.op .mk{
  flex-shrink:0;width:22px;height:22px;border-radius:6px;margin-top:1px;
  border:1.5px solid var(--borda);display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;color:transparent;
  transition:all .13s ease;
}
.op.marcada{border-color:var(--amarelo);background:rgba(247,208,70,.08)}
.op.marcada .mk{background:var(--amarelo);border-color:var(--amarelo);color:#1a1500}
.op.certa{border-color:var(--verde);background:rgba(74,222,128,.09)}
.op.certa .mk{background:var(--verde);border-color:var(--verde);color:#06240f}
.op.errada{border-color:var(--vermelho);background:rgba(248,113,113,.07)}
.op.errada .mk{background:var(--vermelho);border-color:var(--vermelho);color:#2b0a0a}
.op.saiu{opacity:.25;text-decoration:line-through}

.dupla{display:flex;gap:8px}
.dupla .op{flex:1;justify-content:center;text-align:center}
.dupla .op .mk{display:none}

.item{margin-bottom:16px}
.item:last-child{margin-bottom:0}
.item .frase{font-size:15px;line-height:1.5;margin-bottom:9px;color:var(--forte)}
.nota{font-size:13px;color:var(--fraco);margin-top:8px;line-height:1.55;
  padding:9px 12px;border-radius:0 8px 8px 0;}
.nota b{font-weight:700}
.nota-ok{background:rgba(74,222,128,.08);border-left:3px solid var(--verde)}
.nota-ok b{color:var(--verde)}
.nota-erro{background:rgba(248,113,113,.07);border-left:3px solid var(--vermelho)}
.nota-erro b{color:var(--vermelho)}

.retorno{
  display:none;margin-top:14px;padding:13px 15px;border-radius:0 10px 10px 0;
  background:rgba(74,222,128,.09);border-left:3px solid var(--verde);
  font-size:14px;line-height:1.6;
}
.retorno.visivel{display:block}
.retorno b{color:var(--forte)}
.retorno.erro{background:rgba(248,113,113,.07);border-left-color:var(--vermelho)}

.contador{font-size:12.5px;color:var(--fraco);margin-top:10px;text-align:right}

.botao{
  display:block;width:100%;margin-top:10px;border:0;cursor:pointer;text-align:center;
  background:var(--amarelo);color:#1a1500;font-size:15.5px;font-weight:700;
  font-family:inherit;padding:14px;border-radius:10px;text-decoration:none;
  transition:background .14s ease;
}
.botao:first-of-type{margin-top:16px}
.botao:hover{background:var(--amarelo2)}
.botao:disabled{opacity:.3;cursor:default}
.botao.fantasma{background:transparent;color:var(--texto);border:1px solid var(--borda)}
.botao.fantasma:hover{background:var(--alto)}
.oculto{display:none}
.voltar-painel{
  display:block;text-align:center;margin-top:12px;
  background:var(--alto);border:1px solid var(--borda);border-radius:10px;
  color:var(--fraco);font-size:14px;font-weight:600;text-decoration:none;
  padding:13px;transition:background .14s ease,color .14s ease;
}
.voltar-painel:hover{background:var(--cartao);color:var(--texto)}

.abertura{text-align:center;padding:14px 0 4px}
.abertura .selo-abertura{font-size:40px;line-height:1;margin-bottom:14px}
.abertura h2{font-size:20px;margin-bottom:9px}
.abertura .ajuda{margin:0 auto;max-width:400px}

.placar{text-align:center;padding:4px 0 2px}
.estrelas{font-size:26px;letter-spacing:5px;margin-bottom:12px}
.estrelas.cheias{color:var(--amarelo)}
.placar h2{font-size:21px;margin-bottom:8px}
.placar p{margin:0;font-size:14.5px;line-height:1.6}
.nota-repetir{
  margin-top:12px !important;font-size:13px !important;
  color:var(--fraco) !important;line-height:1.55;
}
.rotulo{
  font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--amarelo);
  text-transform:uppercase;margin:22px 0 9px;
}
.respira{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.respira .bola{width:170px;height:170px;border-radius:50%;background:rgba(247,208,70,.14);
  border:2px solid var(--amarelo);display:flex;align-items:center;justify-content:center;
  transform:scale(.55);transition:transform 4s ease-in-out}
.respira .bola span{font-size:22px;font-weight:700;color:var(--forte)}
.respira .fase{margin-top:14px;font-size:15px;font-weight:600;color:var(--amarelo)}
.respira .ciclos{margin-top:6px;font-size:13px;color:var(--fraco)}
.tema-fala{background:var(--alto);border-radius:12px;padding:16px 18px;margin-bottom:6px}
.tema-fala small{display:block;color:var(--fraco);font-size:12.5px;margin-bottom:5px}
.tema-fala p{margin:0;color:var(--forte);font-size:17px;line-height:1.45;font-weight:600}
.cronometro{text-align:center;font-size:54px;font-weight:800;color:var(--amarelo);padding:10px 0 2px;font-variant-numeric:tabular-nums}
.cronometro-rotulo{text-align:center;font-size:13.5px;color:var(--fraco)}
.medidor{height:10px;background:var(--borda);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.medidor i{display:block;height:100%;width:0;background:var(--verde);transition:width .08s}
.link-mini{background:none;border:0;color:var(--fraco);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="caixa">
  <div class="cartao">

    <div class="topo" id="cabecalho">
      <span class="etiqueta" id="etiqueta">Treino</span>
      <span class="passo" id="passo">1 de 5</span>
    </div>
    <div class="trilho" id="barra"><i id="trilho" style="width:20%"></i></div>

    <!-- ===== ABERTURA ===== -->
    <section class="etapa" id="abertura">
      <div class="abertura">
        <div class="selo-abertura" id="ab-selo">🎯</div>
        <h2 id="ab-titulo">Treino</h2>
        <p class="ajuda" id="ab-texto"></p>
      </div>
      <button class="botao" id="b-comecar" onclick="comecar()">Começar treino</button>
      <a class="voltar-painel" id="b-voltar-abertura" href="#" target="_top">← Voltar ao Painel</a>
    </section>

    <!-- ===== PARTE ATUAL (montada pelo motor) ===== -->
    <section class="etapa oculto" id="parte"></section>

    <!-- ===== FIM ===== -->
    <section class="etapa oculto" id="fim">
      <div class="placar">
        <div class="estrelas" id="f-estrelas">★★★★★</div>
        <h2 id="f-titulo">—</h2>
        <p id="f-texto">—</p>
        <p class="nota-repetir">Você pode repetir o treino quantas vezes quiser.
        Sua nota mais alta é a que vale.</p>
      </div>

      <a class="botao" id="b-proximo" href="#" target="_top">Voltar ao Painel</a>
      <button class="botao fantasma" onclick="repetir()">Repetir treino</button>
    </section>

  </div>
</div>

<script>
/* =====================================================================
   TREINOS DE ESCOLHA — motor único
   ---------------------------------------------------------------------
   Este arquivo tem duas metades:
     1. CONTEÚDO  — a lista TREINOS. É aqui que se cria um treino novo.
     2. MECÂNICA  — o motor que monta as telas, confere e dá a nota.
   Treino novo = uma entrada nova em TREINOS. Não precisa mexer no motor.

   Qual treino abrir vem da URL:  treinos.html?t=1.2
   O código é "pilar.treino" (o mesmo que fica salvo no progresso).
   Sem ?t= abre o 1.1, para as aulas antigas continuarem funcionando.
   ===================================================================== */

/* Painel do TAE no Cademí (botão "Voltar ao Painel"). */
const PAINEL = "https://aluno.falalima.com.br/area/embed/L2Njbi55cnBlcmkuYXJpcmYtY2NuLXJuZy8vOmZjZ2d1?1";

/* =====================================================================
   1 · CONTEÚDO
   ---------------------------------------------------------------------
   Cada treino:
     numero    número corrido de 1 a 20 (aparece como "Treino 1")
     nome      nome do treino
     selo      emoji da tela de abertura
     minutos   duração aproximada, aparece na abertura
     partes    lista de exercícios (normalmente 5; cada um vale 1 estrela)
     mensagens 6 mensagens finais, da nota 0 à nota 5 ({t: título, x: texto})

   Tipos de parte (campo "tipo"):

   "binario"  Uma frase por linha, duas respostas (ex.: "É" / "Não é").
              botoes: [texto do sim, texto do não]
              itens:  [{ t:frase, ok:true/false, p:explicação }]
              minimo: acertos para ganhar a estrela
              fim:    resumo no final. {n} = acertos, {total} = itens

   "escolha"  Uma fala e várias opções, só uma certa. Pode ter várias falas.
              itens:  [{ fala, ops:[...], certa:índice começando em 0, p }]
              minimo e fim: como no binário

   "marcar"   Lista de opções, o aluno marca as certas e confere.
              opcoes: [{ t, ok:true/false }]
              exatamente: (opcional) obriga a marcar esse número
              fala:   (opcional) texto em destaque acima das opções
              certo / errado: retorno. {n} = certas marcadas

   "cortar"   Lista de frases, o aluno tira as que sobram.
              opcoes: [{ t, fica:true/false }]
              cortar: quantas o aluno precisa tirar
              certo / errado: retorno

   "relogio"  Uma pergunta por vez, com tempo para escolher a resposta.
              itens:  [{ pergunta, ops:[...], certa }]
              tempo:  segundos por pergunta. Tempo esgotado conta como erro.
              minimo e fim: como no binário

   "ordenar"  Frases embaralhadas: o aluno toca na ordem certa.
              itens:  [{ contexto, frases:[na ordem CERTA], rotulos:[opcional], p }]
              minimo e fim: como no binário (conta itens com a ordem toda certa)

   "respirar" Respiração guiada: um círculo cresce (puxa o ar) e diminui (solta).
              puxa, solta: segundos de cada fase; ciclos: quantas vezes.
              certo: retorno. A estrela vem ao completar os ciclos.

   "falar"    Fala-surpresa com microfone: tema sorteado, tempo para preparar
              a primeira frase e tempo de fala com medidor de voz.
              temas:[...], preparo e fala: segundos; minimo: segundos de fala
              (do primeiro ao último som) para ganhar a estrela.
              certo / errado: retorno. O áudio não é gravado nem enviado.

   Em todos: titulo, ajuda (texto cinza) e instrucao (texto amarelo).
   ===================================================================== */

const TREINOS = {

  /* ---------------- Treino 1 · Organização de ideias ---------------- */
  /* Cada exercício traz uma situação diferente (trabalho, negócio próprio,
     casa, família), diferente também dos exemplos da aula. */
  "1.1": {
    numero:1, nome:"Organização de ideias", selo:"🎯", minutos:3,
    partes:[
      { tipo:"binario",
        titulo:"Isso é um Objetivo Único?",
        ajuda:"Objetivo é o que você quer que a pessoa faça depois que você falar. Uma coisa só.",
        instrucao:"Escolha uma em cada frase.",
        botoes:["É objetivo", "Não é"],
        itens:[
          { t:"Em casa: \"Quero conversar sobre as tarefas da casa\"", ok:false, p:"Isso é assunto. O que você quer que a outra pessoa faça?" },
          { t:"No trabalho: \"Quero que meu chefe aprove minhas férias em julho\"", ok:true, p:"Diz exatamente o que o chefe precisa fazer." },
          { t:"No negócio: \"Quero que o cliente feche o pacote até sexta\"", ok:true, p:"Uma ação só, e dá pra saber se aconteceu." },
          { t:"Na escola dos filhos: \"Quero reclamar do atraso do transporte e pedir desconto na mensalidade\"", ok:false, p:"Tem um \"e\". São duas conversas." }
        ],
        minimo:3,
        fim:"{n} de {total} certas." },

      { tipo:"escolha",
        titulo:"O que essa pessoa quer?",
        ajuda:"Falou bastante. Mas o que queria mesmo?",
        instrucao:"Escolha uma opção em cada fala.",
        itens:[
          { fala:"O André, conversando com a esposa: \"Amor, essa semana foi muito corrida, o trabalho tá puxado, a casa tá uma bagunça, e eu fico pensando que a gente podia se organizar melhor… sei lá, talvez dividir as coisas de outro jeito…\"",
            ops:["Reclamar do trabalho", "Que os dois dividam as tarefas da casa de outro jeito", "Contar como foi a semana"],
            certa:1,
            p:"O pedido veio no fim, perdido no meio do desabafo." },
          { fala:"A Bia, que é fotógrafa, falando com uma cliente: \"Então, as fotos ficaram lindas, deu um trabalhão editar tudo, e o meu notebook travou duas vezes no meio, mas tá quase tudo pronto, só falta aquele pagamento da segunda parcela pra eu liberar…\"",
            ops:["Mostrar que as fotos ficaram boas", "Explicar o problema do notebook", "Que a cliente pague a segunda parcela"],
            certa:2,
            p:"O pedido estava escondido no meio de tanta explicação." }
        ],
        minimo:2,
        fim:"{n} de {total} certas." },

      { tipo:"marcar",
        titulo:"Quais são as âncoras?",
        ajuda:"O Marcos vai pedir ao dono do apartamento pra não aumentar tanto o aluguel. Ele quer falar de três coisas: o reajuste alto, que sempre pagou em dia, e uma proposta de valor.",
        instrucao:"Marque as que servem de âncora: uma palavra só.",
        opcoes:[
          { t:"reajuste", ok:true },
          { t:"o aluguel subiu demais esse ano", ok:false },
          { t:"pontualidade", ok:true },
          { t:"eu sempre paguei tudo certinho, nunca atrasei", ok:false },
          { t:"proposta", ok:true },
          { t:"queria propor um valor que caiba no meu bolso", ok:false }
        ],
        certo:"Três palavras. O Marcos lembra delas e a frase sai sozinha.",
        errado:"As âncoras são as de uma palavra só. As outras já são frases inteiras, e frase você esquece no meio." },

      { tipo:"escolha",
        titulo:"Qual fala funciona melhor?",
        ajuda:"O Diego tem uma oficina mecânica e precisa avisar um cliente que o carro vai atrasar.",
        instrucao:"Escolha uma versão.",
        itens:[
          { fala:"O Diego liga para o cliente. As três versões são curtas e educadas.",
            ops:["\"A peça do seu carro atrasou. O distribuidor teve um problema no estoque e só vai entregar amanhã.\"",
                 "\"Seu carro vai atrasar um pouquinho, mas fica tranquilo que a gente já tá resolvendo. Assim que tiver novidade, eu te aviso, tá bom?\"",
                 "\"A peça do seu carro só chega amanhã, então ele fica pronto quinta, às 10h. Pode buscar nesse horário?\""],
            certa:2,
            p:"Ser curto não basta. A terceira tem as três âncoras (peça, quinta, buscar) e termina no objetivo: o cliente sabe exatamente o que fazer." }
        ],
        minimo:1,
        fim:"{n} de {total} certa." },

      { tipo:"escolha",
        titulo:"Agora é com você",
        ajuda:"A Patrícia quer que a mãe, de 62 anos, vá ao médico fazer um check-up.",
        instrucao:"Responda as duas perguntas.",
        itens:[
          { fala:"Qual é o objetivo da Patrícia?",
            ops:["Falar sobre saúde", "Que a mãe marque a consulta esta semana", "Reclamar que ela não se cuida e pedir pra ela caminhar mais"],
            certa:1,
            p:"Uma coisa só, e a mãe sabe exatamente o que fazer." },
          { fala:"Quais seriam as âncoras da Patrícia?",
            ops:["exame · idade · horário", "faz três anos que você não faz exame nenhum", "saúde, saúde, saúde"],
            certa:0,
            p:"Uma palavra pra cada ideia. Nem frase inteira, nem palavra repetida." }
        ],
        minimo:2,
        fim:"{n} de {total} certas." }
    ],
    mensagens:[
      { t:"😞 Não foi dessa vez",
        x:"Mas você fez o treino inteiro, e isso já conta. Assista à aula de novo com calma e volte aqui." },
      { t:"😕 Você acertou uma",
        x:"Uma já mostra que tem coisa entendida aí. Repita o treino agora, enquanto a aula está fresca." },
      { t:"😐 Metade do caminho",
        x:"Você está pegando a lógica. Falta repetir até virar automático." },
      { t:"🙂 Bom resultado",
        x:"Você já sabe achar o objetivo e transformar ideias em âncoras. Dá pra usar isso hoje." },
      { t:"😃 Quase perfeito",
        x:"Faltou um detalhe. O essencial você já domina: um objetivo só e uma palavra pra cada ideia." },
      { t:"🤩 Acertou tudo",
        x:"Agora a parte que vale de verdade: antes da sua próxima conversa importante, escolha o objetivo e três âncoras." }
    ]
  },

  /* ---------------- Treino 2 · Comunicação lógica ---------------- */
  "1.2": {
    numero:2, nome:"Comunicação lógica", selo:"🧭", minutos:3,
    partes:[
      { tipo:"escolha",
        titulo:"Isso é Fato, Motivo ou Objetivo?",
        ajuda:"Fato é o que aconteceu. Motivo é por que importa. Objetivo é o pedido.",
        instrucao:"Escolha uma opção em cada frase.",
        itens:[
          { fala:"\"As vendas caíram 15% em setembro.\"",
            ops:["Fato", "Motivo", "Objetivo"], certa:0,
            p:"É o que aconteceu, com número." },
          { fala:"\"Sem o sistema novo, a equipe vai continuar fazendo hora extra.\"",
            ops:["Fato", "Motivo", "Objetivo"], certa:1,
            p:"Mostra por que isso importa." },
          { fala:"\"Quero sua aprovação pra contratar mais uma pessoa até o fim do mês.\"",
            ops:["Fato", "Motivo", "Objetivo"], certa:2,
            p:"É o pedido: o que você quer que o outro faça." },
          { fala:"\"Recebemos 40 reclamações de clientes na última semana.\"",
            ops:["Fato", "Motivo", "Objetivo"], certa:0,
            p:"É o que aconteceu. E o número dá força." }
        ],
        minimo:3,
        fim:"{n} de {total} certas." },

      { tipo:"ordenar",
        titulo:"Coloque na ordem certa",
        ajuda:"Toque nas frases na ordem em que você falaria.",
        instrucao:"Toque de novo para desfazer.",
        itens:[
          { contexto:"A Marina quer mudar o horário da reunião.",
            frases:["Nas últimas quatro reuniões, a gente começou com 20 minutos de atraso.",
                    "Às 8h, três pessoas do time ainda estão no trânsito.",
                    "Preciso mudar a reunião de segunda pras 10h."],
            rotulos:["Fato", "Motivo", "Objetivo"],
            p:"Fato com número, depois o motivo, e o pedido no fim." },
          { contexto:"O Pedro quer que a empresa pague um curso.",
            frases:["Gasto umas 5 horas por semana montando relatório na mão.",
                    "Com o curso, isso cai pra uma hora e sobra tempo pros clientes.",
                    "Queria que a empresa pagasse o curso de Excel avançado."],
            rotulos:["Fato", "Motivo", "Objetivo"],
            p:"Quando o pedido chega, o chefe já tem motivo pra dizer sim." }
        ],
        minimo:2,
        fim:"{n} de {total} na ordem certa." },

      { tipo:"escolha",
        titulo:"Qual versão convence mais?",
        ajuda:"Mesma pessoa, mesmo pedido. Só muda a ordem.",
        instrucao:"Escolha uma versão em cada caso.",
        itens:[
          { fala:"O Bruno quer folgar na sexta.",
            ops:["\"Então, semana passada eu fiquei até tarde três dias, e no fim de semana também trabalhei, e eu tava pensando se dava pra folgar sexta…\"",

/* ================= PROGRESSO NO CADEMÍ =================
   O progresso fica numa nota interna do aluno no Cademí.
   O Make só lê e grava (cenário "TAE - Progresso do aluno");
   quem monta o conteúdo é o próprio app, para gastar poucos créditos.
   Formato da nota: TAE|1.1=5|2.3=4|d2026-10-07|
   treino=estrelas (a maior) e dAAAA-MM-DD (dias em que treinou). */
const PROGRESSO_URL = "https://hook.us1.make.com/a9bpauyn4nsdi1dsq9pag166skfidr28";
const DIAS_GUARDADOS = 90;
const CACHE_MINUTOS = 10;

function hojeTexto(){ return new Date().toLocaleDateString("sv-SE"); }

function lerTextoProgresso(texto, destino){
  if(!texto || texto.indexOf("TAE|") !== 0) return;
  texto.split("|").forEach(function(parte){
    if(/^d\d{4}-\d{2}-\d{2}$/.test(parte)){
      if(destino.dias.indexOf(parte.slice(1)) === -1) destino.dias.push(parte.slice(1));
    }else if(parte.indexOf("=") > 0){
      const k = parte.split("=")[0], v = parseInt(parte.split("=")[1], 10);
      if(!isNaN(v) && (!destino.notas[k] || v > destino.notas[k])) destino.notas[k] = v;
    }
  });
}

/* Resposta do Make = lista de notas do aluno. Junta todas as notas TAE
   (pode haver mais de uma se a chave do Cademí for trocada) e guarda
   o id da mais recente, que é a que será atualizada. */
function lerRespostaCademi(texto){
  const r = { nota:"", notas:{}, dias:[] };
  const lista = (JSON.parse(texto).data || []).filter(function(n){
    return n.body && n.body.indexOf("TAE|") === 0;
  });
  lista.sort(function(a,b){ return (b.updated_at || "").localeCompare(a.updated_at || ""); });
  if(lista.length) r.nota = lista[0].id;
  lista.forEach(function(n){ lerTextoProgresso(n.body, r); });
  return r;
}

function juntarProgresso(a, b){
  const r = { notas:Object.assign({}, a.notas), dias:a.dias.slice() };
  Object.keys(b.notas).forEach(function(k){ if(!r.notas[k] || b.notas[k] > r.notas[k]) r.notas[k] = b.notas[k]; });
  b.dias.forEach(function(d){ if(r.dias.indexOf(d) === -1) r.dias.push(d); });
  return r;
}

function montarCorpo(p){
  const partes = Object.keys(p.notas).sort().map(function(k){ return k + "=" + p.notas[k]; });
  const dias = p.dias.slice().sort().slice(-DIAS_GUARDADOS).map(function(d){ return "d" + d; });
  return "TAE|" + partes.concat(dias).map(function(x){ return x + "|"; }).join("");
}

function buscarCademi(aluno){
  return fetch(PROGRESSO_URL + "?acao=ler&aluno=" + encodeURIComponent(aluno))
    .then(function(r){ return r.text(); })
    .then(function(t){
      const p = lerRespostaCademi(t);
      guardarCache(aluno, p);
      return p;
    });
}

/* Grava o progresso inteiro. Devolve o id da nota (nova ou a mesma). */
function salvarCademi(aluno, nota, progresso, treino, primeira){
  const url = PROGRESSO_URL + "?acao=salvar&aluno=" + encodeURIComponent(aluno) +
    "&corpo=" + encodeURIComponent(montarCorpo(progresso)) +
    "&treino=" + encodeURIComponent(treino || "") + "&primeira=" + (primeira ? "sim" : "nao") +
    (nota ? "&nota=" + encodeURIComponent(nota) : "");
  return fetch(url).then(function(r){ return r.text(); }).then(function(t){
    t = (t || "").trim();
    const id = /^note_\d+$/.test(t) ? t : nota;
    guardarCache(aluno, { nota:id, notas:progresso.notas, dias:progresso.dias });
    return id;
  });
}

function guardarCache(aluno, p){
  try{
    localStorage.setItem("tae_cademi_" + aluno, JSON.stringify({
      nota:p.nota, notas:p.notas, dias:p.dias, quando:Date.now() }));
  }catch(e){}
}

function lerCache(aluno){
  try{
    const c = JSON.parse(localStorage.getItem("tae_cademi_" + aluno) || "null");
    if(c && Date.now() - c.quando < CACHE_MINUTOS * 60000) return c;
  }catch(e){}
  return null;
}

/* Guarda a nota deste treino (vale a mais alta) no navegador e no Cademí. */
function guardarNota(estrelas){
  const hoje = hojeTexto();
  let quem = "visitante";
  const local = { notas:{}, dias:[] };
  try{
    quem = localStorage.getItem("tae_aluno_atual") || "visitante";
    local.notas = JSON.parse(localStorage.getItem("tae_notas_" + quem) || "{}");
    if(local.notas[CODIGO] === undefined || estrelas > local.notas[CODIGO]) local.notas[CODIGO] = estrelas;
    localStorage.setItem("tae_notas_" + quem, JSON.stringify(local.notas));
    local.dias = JSON.parse(localStorage.getItem("tae_dias_" + quem) || "[]");
    if(local.dias.indexOf(hoje) === -1) local.dias.push(hoje);
    localStorage.setItem("tae_dias_" + quem, JSON.stringify(local.dias));
  }catch(e){}

  if(quem === "visitante") return;

  /* Lê o progresso do Cademí na hora, junta com o deste aparelho e grava.
     Assim um treino feito em outro aparelho nunca é apagado. */
  buscarCademi(quem).then(function(servidor){
    const juntas = juntarProgresso(servidor, local);
    return salvarCademi(quem, servidor.nota, juntas, CODIGO, servidor.notas[CODIGO] === undefined);
  }).catch(function(){ /* sem internet: o painel reenvia depois */ });
}

}
/* Microfone sem os filtros do navegador (supressão de ruído e volume
   automático mudam o volume sozinhos e confundem a medição). */
function pedirMicCru(){
  return navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
    .catch(function(){ return navigator.mediaDevices.getUserMedia({ audio:true }); });
}
let falaRms = 0, falaVigia = null;
function comecarFala(){
  const p = parte();
  el("aviso-mic").classList.add("oculto");
  el("retorno").className = "retorno";
  el("b-seguir").classList.add("oculto");
  pedirMicCru().then(function(s){
    falaFluxo = s;
    el("b-falar").classList.add("oculto");
    el("b-outro").classList.add("oculto");
    /* O medidor começa já no preparo: assim o barulho da sala é medido
       enquanto a pessoa pensa, e não no começo da fala. Antes, quem
       começava a falar na hora tinha a própria voz tomada por "ruído". */
    falaCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(falaCtx.state === "suspended" && falaCtx.resume) falaCtx.resume();
    const an = falaCtx.createAnalyser();
    an.fftSize = 1024;
    falaCtx.createMediaStreamSource(falaFluxo).connect(an);
    const buf = new Float32Array(an.fftSize);
    (function loop(){
      an.getFloatTimeDomainData(buf);
      let soma = 0; for(let k = 0; k < buf.length; k++) soma += buf[k] * buf[k];
      falaRms = Math.sqrt(soma / buf.length);
      if(falaAmostras) falaAmostras.push(falaRms);
      const n = el("nivel"); if(n) n.style.width = Math.min(100, falaRms * 600) + "%";
      falaQuadro = requestAnimationFrame(loop);
    })();
    falaAmostras = [];
    let resta = p.preparo;
    el("fala-area").innerHTML = '<div class="cronometro" id="crono">' + resta + '</div>' +
      '<div class="cronometro-rotulo" id="crono-txt">Respire e prepare a sua primeira frase</div>';
    falaTimer = setInterval(function(){
      resta--;
      el("crono").textContent = resta;
      if(resta <= 0){ clearInterval(falaTimer); falaTimer = null; falarAgora(); }
    }, 1000);
  }).catch(function(){ el("aviso-mic").classList.remove("oculto"); });
}
let falaAmostras = null;
function falarAgora(){
  const p = parte();
  /* Ruído da sala = os 20% mais baixos do preparo. */
  const ord = (falaAmostras || []).slice().sort(function(a, b){ return a - b; });
  const baixo = ord.length ? ord[Math.floor(ord.length * 0.2)] : 0.005;
  const limiar = Math.max(0.012, baixo * 3);
  falaAmostras = null;
  el("crono-txt").textContent = "Fale agora";
  el("fala-area").insertAdjacentHTML("beforeend", '<div class="medidor"><i id="nivel"></i></div>');
  const inicio = Date.now();
  let primeiro = 0, ultimo = 0;
  falaVigia = setInterval(function(){
    const t = (Date.now() - inicio) / 1000;
    if(falaRms > limiar){ if(!primeiro) primeiro = t || 0.01; ultimo = t; }
  }, 50);
  let resta = p.fala;
  el("crono").textContent = resta;
  falaTimer = setInterval(function(){
    resta--;
    el("crono").textContent = Math.max(0, resta);
    if(resta <= 0){
      clearInterval(falaVigia); falaVigia = null;
      pararFala();
      const falou = primeiro ? Math.round(ultimo - primeiro) : 0;
      const ok = falou >= p.minimo;
      if(ok) pontos++;
      el("crono-txt").textContent = "Você falou por cerca de " + falou + " segundos.";
      mostrarRetorno(ok, ok ? p.certo : p.errado);
      el("b-seguir").classList.remove("oculto");
      if(!ok){
        el("b-falar").textContent = "Tentar de novo";
        el("b-falar").classList.remove("oculto");
        el("b-outro").classList.remove("oculto");
      }
    }
  }, 1000);
}

/* Relógio: o motor monta a casca; cada pergunta entra uma por vez. */
TIPOS.relogio = {
  montar:function(p){
    relIdx = 0;
    return '<div id="lista"></div>' +
      '<div class="retorno" id="retorno"></div>' +
      '<button class="botao oculto" id="b-seguir" onclick="seguir()">' + rotuloSeguir() + '</button>';
  },
  depois:function(){ mostrarPergunta(); }
};

let relIdx = 0, relTimer = null;

function pararRelogio(){ if(relTimer){ clearInterval(relTimer); relTimer = null; } }

function mostrarPergunta(){
  const p = parte(), it = p.itens[relIdx];
  const caixa = document.createElement("div");
  caixa.className = "item";
  caixa.style.marginBottom = "22px";
  caixa.innerHTML =
    '<div class="frase">' + (relIdx + 1) + ' de ' + p.itens.length + ' · ' + it.pergunta + '</div>' +
    '<div class="trilho" style="margin:0 0 10px"><i class="rel-barra" style="width:100%;transition:width .1s linear"></i></div>' +
    '<div class="lista">' + it.ops.map(function(o,k){
      return '<button class="op" onclick="responderRelogio(' + k + ')"><span class="mk">✓</span><span>' + o + '</span></button>';
    }).join("") + '</div>';
  el("lista").appendChild(caixa);
  const barra = caixa.querySelector(".rel-barra");
  const inicio = Date.now(), total = (p.tempo || 10) * 1000;
  pararRelogio();
  relTimer = setInterval(function(){
    const resta = Math.max(0, total - (Date.now() - inicio));
    barra.style.width = (resta / total * 100) + "%";
    if(resta <= total * 0.3) barra.style.background = "var(--vermelho)";
    if(resta === 0) responderRelogio(-1);
  }, 100);
  enquadrar();
}

function responderRelogio(k){
  const p = parte(), it = p.itens[relIdx];
  const caixas = document.querySelectorAll("#lista > .item");
  const caixa = caixas[caixas.length - 1];
  const g = caixa.querySelectorAll(".op");
  if(g[0].disabled) return;
  pararRelogio();
  g.forEach(function(b){ b.disabled = true; });
  g[it.certa].classList.add("certa");
  const acertou = k === it.certa;
  if(acertou) acertos++; else if(k >= 0) g[k].classList.add("errada");
  const d = document.createElement("div");
  d.className = "nota" + (acertou ? " nota-ok" : " nota-erro");
  d.innerHTML = acertou ? "<b>✅ Correto</b>" : (k < 0 ? "<b>⏱ Tempo esgotado</b>" : "<b>🛑 Errado</b>");
  caixa.appendChild(d);
  if(relIdx < p.itens.length - 1){
    const b = document.createElement("button");
    b.className = "botao fantasma";
    b.textContent = "Próxima pergunta";
    b.onclick = function(){ b.remove(); relIdx++; mostrarPergunta(); };
    caixa.appendChild(b);
    return;
  }
  if(acertos >= p.minimo) pontos++;
  mostrarRetorno(null, preencher(p.fim, { n:acertos, total:p.itens.length }));
  el("b-seguir").classList.remove("oculto");
}

/* Ordem embaralhada de 0..n-1 que nunca sai já na ordem certa. */
function embaralhar(n){
  const a = []; for(let k=0;k<n;k++) a.push(k);
  do{
    for(let k=n-1;k>0;k--){ const r = Math.floor(Math.random()*(k+1)); const t = a[k]; a[k] = a[r]; a[r] = t; }
  }while(n > 1 && a.every(function(v,k){ return v === k; }));
  return a;
}

/* Caixa de retorno + botão de seguir (escondido até a parte terminar). */
function retornoEBotao(escondido){
  return '<div class="retorno" id="retorno"></div>' +
    '<button class="botao' + (escondido ? ' oculto' : '') + '" id="b-seguir" onclick="seguir()">' + rotuloSeguir() + '</button>';
}
function rotuloSeguir(){ return atual === TREINO.partes.length - 1 ? "Ver resultado" : "Continuar"; }
function parte(){ return TREINO.partes[atual]; }

/* ================= RESPOSTAS ================= */

/* Retorno embaixo de cada item (binário e escolha). */
function notaItem(i, txt, acertou){
  const d = document.createElement("div");
  d.className = "nota" + (acertou ? " nota-ok" : " nota-erro");
  d.innerHTML = '<b>' + (acertou ? "✅ Correto" : "🛑 Errado") + '</b> ' + txt;
  document.querySelectorAll("#lista > .item")[i].appendChild(d);
}

/* Binário e escolha: quando todos os itens foram respondidos, fecha a parte. */
function talvezFechar(){
  const p = parte();
  const respondidos = document.querySelectorAll("#lista > .item .nota").length;
  if(respondidos < p.itens.length) return;
  if(acertos >= p.minimo) pontos++;
  mostrarRetorno(null, preencher(p.fim, { n:acertos, total:p.itens.length }));
  el("b-seguir").classList.remove("oculto");
}

function responderBinario(i, disseSim){
  const g = document.querySelectorAll("#lista > .item")[i].querySelectorAll(".op");
  if(g[0].disabled) return;
  g.forEach(function(b){ b.disabled = true; });
  const item = parte().itens[i];
  const certo = item.ok ? 0 : 1;
  const escolheu = disseSim ? 0 : 1;
  g[certo].classList.add("certa");
  const acertou = escolheu === certo;
  if(acertou) acertos++; else g[escolheu].classList.add("errada");
  notaItem(i, item.p, acertou);
  talvezFechar();
}

function responderEscolha(i, j){
  const g = document.querySelectorAll("#lista > .item")[i].querySelectorAll(".op");
  if(g[0].disabled) return;
  g.forEach(function(b){ b.disabled = true; });
  const item = parte().itens[i];
  g[item.certa].classList.add("certa");
  const acertou = j === item.certa;
  if(acertou) acertos++; else g[j].classList.add("errada");
  notaItem(i, item.p, acertou);
  talvezFechar();
}

function alternar(i){
  const p = parte();
  const b = document.querySelectorAll("#lista .op")[i];
  if(b.disabled) return;
  const pos = marcadas.indexOf(i);
  if(pos >= 0){ marcadas.splice(pos,1); b.classList.remove("marcada"); }
  else{
    if(p.exatamente && marcadas.length >= p.exatamente) return;
    marcadas.push(i); b.classList.add("marcada");
  }
  el("contagem").textContent = marcadas.length;
  if(p.exatamente) el("b-seguir").disabled = marcadas.length !== p.exatamente;
}

function conferirMarcar(){
  const p = parte();
  const bs = document.querySelectorAll("#lista .op");
  bs.forEach(function(b){ b.disabled = true; b.classList.remove("marcada"); });
  let certo = true, n = 0;
  p.opcoes.forEach(function(o,i){
    const marcou = marcadas.indexOf(i) >= 0;
    if(o.ok){ bs[i].classList.add("certa"); if(marcou) n++; else certo = false; }
    else if(marcou){ bs[i].classList.add("errada"); certo = false; }
  });
  if(certo) pontos++;
  mostrarRetorno(certo, preencher(certo ? p.certo : p.errado, { n:n }));
  const b = el("b-seguir");
  b.textContent = rotuloSeguir();
  b.disabled = false;
  b.onclick = seguir;
}

function cortar(i){
  const p = parte();
  const b = document.querySelectorAll("#lista .op")[i];
  if(b.disabled || marcadas.indexOf(i) >= 0) return;
  marcadas.push(i);
  b.classList.add("saiu");
  el("contagem").textContent = p.cortar - marcadas.length;
  if(marcadas.length < p.cortar) return;
  document.querySelectorAll("#lista .op").forEach(function(x){ x.disabled = true; });
  const certo = p.opcoes.every(function(o,j){ return !(o.fica && marcadas.indexOf(j) >= 0); });
  if(certo) pontos++;
  mostrarRetorno(certo, certo ? p.certo : p.errado);
  el("b-seguir").classList.remove("oculto");
}

/* Ordenar: tocar numera a frase; tocar de novo tira ela (e renumera). */
function ordenarToque(i, j){
  const it = parte().itens[i];
  const caixa = document.querySelectorAll("#lista > .item")[i];
  const bs = caixa.querySelectorAll(".op");
  if(bs[0].disabled) return;
  const o = ordens[i], pos = o.indexOf(j);
  if(pos >= 0) o.splice(pos, 1); else o.push(j);
  bs.forEach(function(b){
    const k = o.indexOf(parseInt(b.dataset.j, 10));
    b.classList.toggle("marcada", k >= 0);
    b.querySelector(".mk").textContent = k >= 0 ? (k + 1) : "";
  });
  const completos = ordens.every(function(x, n){ return x.length === parte().itens[n].frases.length; });
  el("b-seguir").disabled = !completos;
}

function conferirOrdenar(){
  const p = parte();
  let n = 0;
  p.itens.forEach(function(it, i){
    const caixa = document.querySelectorAll("#lista > .item")[i];
    const certo = ordens[i].every(function(j, k){ return j === k; });
    if(certo) n++;
    caixa.querySelectorAll(".op").forEach(function(b){
      const j = parseInt(b.dataset.j, 10);
      b.disabled = true;
      b.classList.remove("marcada");
      b.classList.add(ordens[i].indexOf(j) === j ? "certa" : "errada");
      if(it.rotulos) b.querySelector(".mk").textContent = j + 1;
      if(it.rotulos) b.lastChild.textContent = it.frases[j] + " (" + it.rotulos[j] + ")";
    });
    notaItem(i, it.p, certo);
  });
  acertos = n;
  if(n >= p.minimo) pontos++;
  mostrarRetorno(null, preencher(p.fim, { n:n, total:p.itens.length }));
  const b = el("b-seguir");
  b.textContent = rotuloSeguir();
  b.onclick = seguir;
}

/* certo = true/false mostra ✅/🛑; null mostra só o resumo em negrito. */
function mostrarRetorno(certo, txt){
  const r = el("retorno");
  if(certo === null){
    r.className = "retorno visivel";
    r.innerHTML = "<b>" + txt + "</b>";
    return;
  }
  r.className = "retorno visivel " + (certo ? "ok" : "erro");
  r.innerHTML = (certo ? "<b>✅ Correto.</b> " : "<b>🛑 Errado.</b> ") + txt;
}

/* ================= NAVEGAÇÃO ================= */
/* Traz o treino de volta ao topo da tela. Como a página vive dentro de
   uma moldura no Cademí, scrollIntoView também rola a página de fora —
   window.scrollTo sozinho só moveria o conteúdo interno. */
function enquadrar(){
  const alvo = document.querySelector(".cartao");
  if(alvo && alvo.scrollIntoView) alvo.scrollIntoView({ block:"start", behavior:"smooth" });
  else window.scrollTo(0,0);
}

function mostrarSecao(id){
  document.querySelectorAll(".etapa").forEach(function(s){ s.classList.add("oculto"); });
  el(id).classList.remove("oculto");
}

function ir(i){
  if(typeof pararRelogio === "function") pararRelogio();
  pararRespirar(); pararFala();
  atual = i; marcadas = []; acertos = 0;
  const p = parte(), total = TREINO.partes.length;
  /* "Marque" e "Tire": a ordem muda a cada vez, para o aluno não decorar
     a posição das certas (várias listas alternavam certa/errada). */
  if((p.tipo === "marcar" || p.tipo === "cortar") && p.opcoes){
    const ordem = embaralhar(p.opcoes.length);
    p.opcoes = ordem.map(function(k){ return p.opcoes[k]; });
  }
  el("parte").innerHTML =
    '<h2>' + p.titulo + '</h2>' +
    (p.ajuda ? '<p class="ajuda">' + p.ajuda + '</p>' : '') +
    (p.instrucao ? '<p class="instrucao">' + p.instrucao + '</p>' : '') +
    TIPOS[p.tipo].montar(p);
  mostrarSecao("parte");
  if(TIPOS[p.tipo].depois) TIPOS[p.tipo].depois(p);
  el("passo").textContent = (i + 1) + " de " + total;
  el("trilho").style.width = ((i + 1) / total * 100) + "%";
  enquadrar();
}

function seguir(){
  if(atual < TREINO.partes.length - 1) ir(atual + 1);
  else terminar();
}

function terminar(){
  mostrarSecao("fim");
  el("passo").textContent = "concluído";
  el("trilho").style.width = "100%";
  const estrelas = Math.round(pontos / TREINO.partes.length * 5);
  const caixa = el("f-estrelas");
  caixa.textContent = "★".repeat(estrelas) + "☆".repeat(5 - estrelas);
  caixa.classList.toggle("cheias", estrelas === 5);

  guardarNota(estrelas);

  const msg = TREINO.mensagens[estrelas];
  el("f-titulo").textContent = msg.t;
  el("f-texto").textContent = msg.x;
  enquadrar();
}

function comecar(){
  el("cabecalho").style.display = "";
  el("barra").style.display = "";
  ir(0);
  /* O cabeçalho e a barra acabaram de aparecer e mudaram a altura.
     Enquadra de novo depois que o navegador refez o desenho. */
  requestAnimationFrame(function(){ requestAnimationFrame(enquadrar); });
}

function repetir(){ window.location.reload(); }

/* ================= INÍCIO ================= */
el("b-proximo").href = PAINEL;
el("b-voltar-abertura").href = PAINEL;
el("cabecalho").style.display = "none";
el("barra").style.display = "none";

if(!TREINO){
  el("ab-selo").textContent = "🚧";
  el("ab-titulo").textContent = "Treino não encontrado";
  el("ab-texto").textContent = "Este treino ainda não está disponível. Volte ao Painel e escolha outro.";
  el("b-comecar").classList.add("oculto");
}else{
  const titulo = "Treino " + TREINO.numero + " · " + TREINO.nome;
  document.title = titulo + " · TAE";
  el("etiqueta").textContent = titulo;
  el("ab-selo").textContent = TREINO.selo || "🎯";
  el("ab-titulo").textContent = titulo;
  el("ab-texto").textContent = "Assista à aula acima antes de começar. O treino tem " +
    TREINO.partes.length + " partes e leva cerca de " + (TREINO.minutos || 3) + " minutos.";
}
