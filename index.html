<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAE — Treino de Aumento da Expressividade</title>
<style>
:root{
  --fundo:#111213;
  --cartao:#1b1d1f;
  --cartao-alto:#232629;
  --borda:#2c3034;
  --amarelo:#f7d046;
  --amarelo-escuro:#d9b32c;
  --texto:#dee2e6;
  --texto-forte:#ffffff;
  --texto-fraco:#8d9499;
  --verde:#4ade80;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--fundo);
  color:var(--texto);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:560px;margin:0 auto;padding:4px 16px 20px}

.topo{padding:14px 2px 18px}
.topo h1{margin:0 0 5px;font-size:25px;font-weight:700;color:var(--texto-forte);letter-spacing:-.02em}
.topo p{margin:0;font-size:14.5px;color:var(--texto-fraco);line-height:1.5}
#subtitulo{font-style:italic}

.cartao{
  background:var(--cartao);
  border:1px solid var(--borda);
  border-radius:14px;
  padding:20px;
  margin-bottom:12px;
}
.etiqueta{
  font-size:11.5px;font-weight:700;letter-spacing:.09em;
  color:var(--amarelo);margin-bottom:9px;text-transform:uppercase;
}

.sugestao-titulo{margin:0 0 5px;font-size:21px;font-weight:700;color:var(--texto-forte);letter-spacing:-.01em}
.sugestao-desc{margin:0 0 18px;font-size:14px;color:var(--texto-fraco);line-height:1.5}

.botao{
  display:block;width:100%;border:0;cursor:pointer;text-align:center;
  background:var(--amarelo);color:#1a1500;
  font-size:16px;font-weight:700;font-family:inherit;
  padding:15px;border-radius:10px;text-decoration:none;
  transition:background .14s ease;
}
.botao:hover{background:var(--amarelo-escuro)}
.botao:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}

.numeros{display:flex;gap:10px;margin-bottom:12px}
.numero{
  flex:1;background:var(--cartao);border:1px solid var(--borda);
  border-radius:12px;padding:14px 8px;text-align:center;
}
.numero b{display:block;font-size:23px;font-weight:800;color:var(--amarelo);line-height:1.15}
.numero span{display:block;font-size:11px;color:var(--texto-fraco);margin-top:3px;line-height:1.3}

.barra{height:7px;background:var(--borda);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.barra i{display:block;height:100%;background:var(--amarelo);border-radius:99px;transition:width .45s ease}
.barra-txt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--texto-fraco)}

.linha-pilar{
  display:flex;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--borda);
  cursor:pointer;
}
.linha-pilar:last-child{border-bottom:0;padding-bottom:0}
.linha-pilar:first-child{padding-top:2px}
.linha-pilar:hover .lp-nome{color:var(--amarelo)}
.lp-nome{flex:0 0 108px;font-size:13.5px;font-weight:600;color:var(--texto);transition:color .12s ease}
.lp-barra{flex:1;height:5px;background:var(--borda);border-radius:99px;overflow:hidden}
.lp-barra i{display:block;height:100%;background:var(--amarelo);border-radius:99px;transition:width .4s ease}
.lp-barra i.cheia{background:var(--verde)}
.lp-cont{flex:0 0 auto;font-size:12px;color:var(--texto-fraco);min-width:30px;text-align:right}

.proxima{
  display:none;align-items:center;gap:9px;
  margin-top:15px;padding-top:14px;border-top:1px solid var(--borda);
  font-size:13.5px;color:var(--texto-fraco);line-height:1.45;
}
.proxima.visivel{display:flex}
.proxima b{color:var(--texto);font-weight:600}
.proxima .ico{font-size:19px;flex-shrink:0}

.pilar{margin-bottom:18px}
.pilar-topo{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;padding:0 2px}
.pilar-nome{font-size:16.5px;font-weight:700;color:var(--texto-forte)}
.pilar-contagem{font-size:12.5px;color:var(--texto-fraco);margin-left:auto;white-space:nowrap}
.pilar-resumo{font-size:13.5px;color:var(--texto-fraco);line-height:1.5;margin:0 2px 11px;}

.aulas{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;overflow:hidden}
.aula{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--borda);
  text-decoration:none;color:inherit;cursor:pointer;
  transition:background .12s ease;
}
.aula:last-child{border-bottom:0}
.aula:hover{background:var(--cartao-alto)}
.aula:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}
.aula-marca{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  border:1.5px solid var(--borda);color:var(--texto-fraco);
}
.aula-marca.feita{background:var(--verde);border-color:var(--verde);color:#06240f}
.aula-nome{flex:1;font-size:14.5px;font-weight:600;color:var(--texto)}
.aula-meta{font-size:12px;color:var(--texto-fraco);margin-top:3px;font-weight:400}
.estrelas-aula{color:var(--texto-fraco);font-size:13px;letter-spacing:1.5px}
.estrelas-aula.cheias{color:var(--amarelo)}
.aula-seta{color:var(--texto-fraco);font-size:16px;flex-shrink:0}
.aula.travada{opacity:.4}

.conquista{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--borda)}
.conquista:last-child{border-bottom:0;padding-bottom:0}
.conquista:first-child{padding-top:0}
.medalha{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:var(--cartao-alto);
}
.conquista.ganha .medalha{background:rgba(247,208,70,.16)}
.conquista.pendente{opacity:.45}
.conquista-nome{font-size:14.5px;font-weight:600;color:var(--texto)}
.conquista-desc{font-size:12.5px;color:var(--texto-fraco);margin-top:2px}

.abas{
  display:flex;margin:12px 0 4px;
  background:var(--cartao);border:1px solid var(--borda);
  border-radius:12px;overflow:hidden;
}
.aba{
  flex:1;border:0;background:0;cursor:pointer;
  padding:12px 4px;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--texto-fraco);font-size:11px;font-weight:600;
  border-right:1px solid var(--borda);
  transition:color .14s ease,background .14s ease;
}
.aba:last-child{border-right:0}
.aba svg{width:19px;height:19px;stroke-width:2}
.aba.ativa{color:var(--amarelo);background:var(--cartao-alto)}
.aba:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}

.tela{display:none}
.tela.ativa{display:block}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

<nav class="abas">
  <button class="aba ativa" data-tela="hoje" onclick="irPara('hoje')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Início
  </button>
  <button class="aba" data-tela="jornada" onclick="irPara('jornada')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 5h11l3 3.5-3 3.5H6"/><path d="M6 15h8l2.5 3"/></svg>
    Jornada
  </button>
  <button class="aba" data-tela="evolucao" onclick="irPara('evolucao')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>
    Evolução
  </button>
</nav>

<!-- ========== INÍCIO ========== -->
<section class="tela ativa" id="tela-hoje">
  <div class="topo">
    <h1 id="saudacao">Bom dia</h1>
    <p id="subtitulo">—</p>
  </div>

  <div class="cartao">
    <div class="etiqueta" id="rotulo-treino">Comece seu treino</div>
    <h2 class="sugestao-titulo" id="sug-nome">—</h2>
    <p class="sugestao-desc" id="sug-desc">—</p>
    <a class="botao" id="sug-botao" href="#" target="_top">Começar</a>
  </div>

  <div class="cartao">
    <div class="etiqueta">Seu progresso</div>
    <div class="barra"><i id="barra-hoje" style="width:0%"></i></div>
    <div class="barra-txt">
      <span id="barra-hoje-txt">0 de 20 treinos</span>
      <span id="barra-hoje-pct">0%</span>
    </div>
    <div class="proxima" id="proxima-conquista"></div>
  </div>

  <div class="cartao">
    <div class="etiqueta">Seus pilares</div>
    <div id="resumo-pilares"></div>
  </div>
</section>

<!-- ========== JORNADA ========== -->
<section class="tela" id="tela-jornada">
  <div class="topo">
    <h1>Sua jornada</h1>
    <p>Quatro pilares, vinte treinos. Comece por onde quiser.</p>
  </div>
  <div id="lista-pilares"></div>
</section>

<!-- ========== EVOLUÇÃO ========== -->
<section class="tela" id="tela-evolucao">
  <div class="topo">
    <h1>Sua evolução</h1>
    <p>O que você construiu até aqui.</p>
  </div>

  <div class="numeros">
    <div class="numero"><b id="e-seq">0</b><span>dias seguidos</span></div>
    <div class="numero"><b id="e-feitos">0</b><span>treinos feitos</span></div>
    <div class="numero"><b id="e-pilares">0</b><span>pilares completos</span></div>
  </div>

  <div class="cartao">
    <div class="etiqueta">Conquistas</div>
    <div id="lista-conquistas"></div>
  </div>
</section>

</div>

<script>
/* ===================================================================
   Preencha "aula" com o número da aula no Cademí quando ela existir.
   O número aparece no fim do endereço da aula.
   Enquanto estiver null, o treino aparece como "em breve".
   =================================================================== */
const BASE_AULA = "https://aluno.falalima.com.br/area/conteudo/aula/";
const TOTAL = 20;

const PILARES = [
  { id:1, nome:"Clareza",
    resumo:"Organizar as ideias e o raciocínio.",
    treinos:[
      { n:1, nome:"Organização de ideias", aula:9684559 },
      { n:2, nome:"Sequência lógica", aula:null },
      { n:3, nome:"Especificidade na fala", aula:null },
      { n:4, nome:"Visualização do outro", aula:null },
      { n:5, nome:"Respostas rápidas", aula:null }
    ]},
  { id:2, nome:"Segurança",
    resumo:"Transmitir confiança no verbal e no não verbal.",
    treinos:[
      { n:1, nome:"A pausa no lugar do vício", aula:null },
      { n:2, nome:"Desacelere o fim da frase", aula:null },
      { n:3, nome:"Afirme sem pedir licença", aula:null },
      { n:4, nome:"O corpo fala antes", aula:null },
      { n:5, nome:"Sustente o silêncio", aula:null }
    ]},
  { id:3, nome:"Assertividade",
    resumo:"Posicionar-se, argumentar e defender ideias.",
    treinos:[
      { n:1, nome:"Diga não sem rodeio", aula:null },
      { n:2, nome:"Peça o que você quer", aula:null },
      { n:3, nome:"Discorde sem atacar", aula:null },
      { n:4, nome:"Defenda sob contestação", aula:null },
      { n:5, nome:"Receba crítica sem desabar", aula:null }
    ]},
  { id:4, nome:"Oratória",
    resumo:"Apresentar para muita gente.",
    treinos:[
      { n:1, nome:"A abertura que prende", aula:null },
      { n:2, nome:"Conduza sem ler", aula:null },
      { n:3, nome:"Ritmo e ênfase", aula:null },
      { n:4, nome:"O fechamento que fica", aula:null },
      { n:5, nome:"Perguntas do público", aula:null }
    ]}
];

const FRASES = [
  "Quem fala bem não nasceu assim. Treinou.",
  "A boa ideia mal dita perde para a ideia média bem dita.",
  "Clareza não é falar pouco. É não sobrar palavra.",
  "A pausa que te assusta é a que faz o outro prestar atenção.",
  "Improviso é estrutura decorada.",
  "Quem entende explica. Quem não entende complica.",
  "Sua ideia só existe depois que alguém entende.",
  "A primeira frase decide se vão ouvir o resto.",
  "Ninguém decide por quem fala mais. Decidem por quem fala claro.",
  "Falar bem é escolher o que não dizer.",
  "O silêncio incomoda quem fala, nunca quem ouve.",
  "Nervoso todo mundo fica. Despreparado, não precisa.",
  "Cinco minutos por dia valem mais que uma hora no domingo.",
  "Treinar é falar quando ninguém está avaliando.",
  "Quem resume bem pensou melhor.",
  "Antes de convencer, seja entendido.",
  "O jargão protege quem fala e afasta quem ouve.",
  "Repetir não é reforçar. É cansar.",
  "Quem começa pelo contexto perde o ouvinte no meio.",
  "Comunicação não é dom. É repertório com repetição.",
  "A frase curta sobrevive à reunião. A longa, não."
];

function fraseDoDia(){
  const hoje = new Date();
  const inicio = new Date(hoje.getFullYear(), 0, 0);
  const dia = Math.floor((hoje - inicio) / 86400000);
  return FRASES[dia % FRASES.length];
}

const CONQUISTAS = [
  { icone:"🌱", nome:"Primeiro passo", desc:"Conclua seu primeiro treino",
    teste:p => p.feitos >= 1, faltam:p => 1 - p.feitos },
  { icone:"⚡", nome:"Primeiro pilar", desc:"Complete um pilar inteiro",
    teste:p => p.pilares >= 1, faltam:p => p.faltamParaPilar },
  { icone:"🔥", nome:"Metade do caminho", desc:"Chegue a 10 treinos",
    teste:p => p.feitos >= 10, faltam:p => 10 - p.feitos },
  { icone:"🎯", nome:"Três pilares", desc:"Complete três pilares",
    teste:p => p.pilares >= 3, faltam:null },
  { icone:"🏆", nome:"Jornada completa", desc:"Conclua os 20 treinos",
    teste:p => p.feitos >= TOTAL, faltam:p => TOTAL - p.feitos }
];

/* ---------- Aluno (vem do Cademí) ---------- */
const ALUNO = (function(){
  const p = new URLSearchParams(window.location.search);
  const g = (p.get("cuser_gratis") || "").toLowerCase();
  return {
    id: p.get("cuser_id") || null,
    email: p.get("cuser_email") || null,
    nome: p.get("cuser_name") || null,
    primeiroNome: p.get("cuser_fname") || null,
    gratuito: g === "1" || g === "true" || g === "sim",
    identificado: !!p.get("cuser_id")
  };
})();

const PILARES_GRATUITOS = 1;
function pilarBloqueado(id){ return ALUNO.gratuito && id > PILARES_GRATUITOS; }

/* ---------- Progresso ---------- */
/* A fonte da verdade é a nota em estrelas que a página de treino grava.
   Treino com nota é treino feito. */
let NOTAS = {};
let SEQUENCIA = 0;

function carregar(){
  const quem = ALUNO.id || "visitante";
  try{ NOTAS = JSON.parse(localStorage.getItem("tae_notas_" + quem) || "{}"); }
  catch(e){ NOTAS = {}; }
  try{
    const p = JSON.parse(localStorage.getItem("tae_" + quem) || "{}");
    SEQUENCIA = p.sequencia || 0;
  }catch(e){ SEQUENCIA = 0; }
}

function codigo(pilarId, n){ return pilarId + "." + n; }
function nota(pilarId, n){ return NOTAS[codigo(pilarId, n)]; }
function feito(pilarId, n){ return nota(pilarId, n) !== undefined; }

function estrelas(pilarId, n){
  const v = nota(pilarId, n);
  if(v === undefined) return null;
  const classe = v === 5 ? "estrelas-aula cheias" : "estrelas-aula";
  return '<span class="' + classe + '">' + "★".repeat(v) + "☆".repeat(5 - v) + '</span>';
}

function resumo(){
  let feitos = 0, pilares = 0, faltamParaPilar = 99;
  PILARES.forEach(function(p){
    let c = 0;
    p.treinos.forEach(function(t){ if(feito(p.id,t.n)) c++; });
    feitos += c;
    if(c === p.treinos.length) pilares++;
    else if(c > 0 && !pilarBloqueado(p.id)){
      const f = p.treinos.length - c;
      if(f < faltamParaPilar) faltamParaPilar = f;
    }
  });
  return { feitos:feitos, pilares:pilares, total:TOTAL,
           sequencia:SEQUENCIA, faltamParaPilar:faltamParaPilar };
}

/* ---------- Navegação ---------- */
function irPara(tela){
  document.querySelectorAll(".tela").forEach(function(s){ s.classList.remove("ativa"); });
  document.getElementById("tela-" + tela).classList.add("ativa");
  document.querySelectorAll(".aba").forEach(function(b){ b.classList.toggle("ativa", b.dataset.tela === tela); });
  window.scrollTo(0,0);
  if(tela === "jornada") montarPilares();
  if(tela === "evolucao") montarEvolucao();
}

/* ---------- Início ---------- */
function montarHoje(){
  const hora = new Date().getHours();
  const s = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";
  document.getElementById("saudacao").textContent = s + (ALUNO.primeiroNome ? (", " + ALUNO.primeiroNome) : "");
  document.getElementById("subtitulo").textContent = fraseDoDia();

  const r = resumo();

  let sug = null, sugPilar = null;
  for(let i=0;i<PILARES.length && !sug;i++){
    const p = PILARES[i];
    if(pilarBloqueado(p.id)) continue;
    for(let j=0;j<p.treinos.length;j++){
      if(!feito(p.id, p.treinos[j].n)){ sug = p.treinos[j]; sugPilar = p; break; }
    }
  }

  const rotulo = document.getElementById("rotulo-treino");
  const botao = document.getElementById("sug-botao");
  const comecou = r.feitos > 0;

  if(!sug){
    rotulo.textContent = "Jornada completa";
    document.getElementById("sug-nome").textContent = "Os 20 treinos estão concluídos";
    document.getElementById("sug-desc").textContent = "Repetir um treino vale tanto quanto fazer pela primeira vez.";
    botao.textContent = "Ver jornada";
    botao.removeAttribute("target");
    botao.href = "#";
    botao.onclick = function(e){ e.preventDefault(); irPara("jornada"); };
  }else{
    rotulo.textContent = comecou ? "Continue de onde parou" : "Comece seu treino";
    document.getElementById("sug-nome").textContent = sug.nome;
    document.getElementById("sug-desc").textContent = sugPilar.nome;
    if(sug.aula){
      botao.textContent = comecou ? "Continuar" : "Começar";
      botao.href = BASE_AULA + sug.aula;
      botao.setAttribute("target","_top");
      botao.onclick = null;
    }else{
      botao.textContent = "Em breve";
      botao.href = "#";
      botao.removeAttribute("target");
      botao.onclick = function(e){ e.preventDefault(); };
    }
  }

  const pct = Math.round(r.feitos / r.total * 100);
  document.getElementById("barra-hoje").style.width = pct + "%";
  document.getElementById("barra-hoje-txt").textContent = r.feitos + " de " + r.total + " treinos";
  document.getElementById("barra-hoje-pct").textContent = pct + "%";

  mostrarProximaConquista(r);
  montarResumoPilares();
}

function montarResumoPilares(){
  document.getElementById("resumo-pilares").innerHTML = PILARES.map(function(p){
    const bloq = pilarBloqueado(p.id);
    let c = 0;
    p.treinos.forEach(function(t){ if(feito(p.id,t.n)) c++; });
    const pct = Math.round(c / p.treinos.length * 100);
    const cheia = c === p.treinos.length ? " cheia" : "";
    const cont = bloq ? "🔒" : c + "/" + p.treinos.length;
    return '<div class="linha-pilar" onclick="irPara(&#39;jornada&#39;)">' +
      '<span class="lp-nome">' + p.nome + '</span>' +
      '<span class="lp-barra"><i class="' + cheia.trim() + '" style="width:' + (bloq ? 0 : pct) + '%"></i></span>' +
      '<span class="lp-cont">' + cont + '</span></div>';
  }).join("");
}

function mostrarProximaConquista(r){
  const caixa = document.getElementById("proxima-conquista");
  let alvo = null;
  for(let i=0;i<CONQUISTAS.length;i++){
    const c = CONQUISTAS[i];
    if(c.teste(r)) continue;
    if(typeof c.faltam !== "function") continue;
    const f = c.faltam(r);
    if(f > 0 && f <= 3){ alvo = { c:c, faltam:f }; break; }
  }
  if(!alvo){ caixa.classList.remove("visivel"); caixa.innerHTML = ""; return; }
  const plural = alvo.faltam === 1 ? "treino" : "treinos";
  caixa.innerHTML = '<span class="ico">' + alvo.c.icone + '</span>' +
    '<span>Faltam <b>' + alvo.faltam + ' ' + plural + '</b> para ' + alvo.c.nome + '</span>';
  caixa.classList.add("visivel");
}

/* ---------- Jornada ---------- */
function montarPilares(){
  document.getElementById("lista-pilares").innerHTML = PILARES.map(function(p){
    const bloq = pilarBloqueado(p.id);
    let c = 0;
    p.treinos.forEach(function(t){ if(feito(p.id,t.n)) c++; });

    const linhas = p.treinos.map(function(t){
      const ok = feito(p.id, t.n);
      const marca = '<div class="aula-marca' + (ok ? " feita" : "") + '">' + (ok ? "✓" : t.n) + '</div>';
      const est = estrelas(p.id, t.n);
      const meta = est ? est : (t.aula ? "ainda não feito" : "em breve");
      const corpo = '<div class="aula-nome">' + t.nome +
                    '<div class="aula-meta">' + meta + '</div></div>';
      if(bloq || !t.aula){
        return '<div class="aula travada">' + marca + corpo + '<span class="aula-seta">🔒</span></div>';
      }
      return '<a class="aula" href="' + BASE_AULA + t.aula + '" target="_top">' + marca + corpo +
             '<span class="aula-seta">›</span></a>';
    }).join("");

    return '<div class="pilar">' +
      '<div class="pilar-topo"><span class="pilar-nome">' + p.nome + '</span>' +
      '<span class="pilar-contagem">' + (bloq ? "bloqueado" : c + "/" + p.treinos.length) + '</span></div>' +
      '<p class="pilar-resumo">' + p.resumo + '</p>' +
      '<div class="aulas">' + linhas + '</div></div>';
  }).join("");
}

/* ---------- Evolução ---------- */
function montarEvolucao(){
  const r = resumo();
  document.getElementById("e-seq").textContent = r.sequencia;
  document.getElementById("e-feitos").textContent = r.feitos;
  document.getElementById("e-pilares").textContent = r.pilares;

  document.getElementById("lista-conquistas").innerHTML = CONQUISTAS.map(function(c){
    const g = c.teste(r);
    return '<div class="conquista ' + (g ? "ganha" : "pendente") + '">' +
      '<div class="medalha">' + c.icone + '</div>' +
      '<div><div class="conquista-nome">' + c.nome + '</div>' +
      '<div class="conquista-desc">' + (g ? "Conquistada" : c.desc) + '</div></div></div>';
  }).join("");
}

carregar();

/* Guarda quem é o aluno da vez. A página de treino lê isto para saber
   em qual progresso gravar, já que ela não recebe os dados do Cademí. */
try{ localStorage.setItem("tae_aluno_atual", ALUNO.id || "visitante"); }catch(e){}

/* Recarrega ao voltar para a aba, para refletir treino feito em outra. */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible"){
    carregar();
    montarHoje();
    if(document.getElementById("tela-jornada").classList.contains("ativa")) montarPilares();
    if(document.getElementById("tela-evolucao").classList.contains("ativa")) montarEvolucao();
  }
});

montarHoje();
</script>
</body>
</html>
